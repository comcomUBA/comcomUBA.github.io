  - nombre: Ittig
    contenido: |
      ## Quién soy?

      Hola! Mi nombre es Ernesto Ittig y me estoy presentando a la elección de codepper estudiantil.
      Tal vez me reconozcas porque recibiste un mail mío por DC-todos, o por la ComCom.

      Algunos datos sobre mí:

      - Ayudo en **los talleres de Git y LaTeX** de la ComCom.
      - En la última Semana de la computación, me tocó contribuir en el stand del [problema del viajante de comercio](https://en.wikipedia.org/wiki/Travelling_salesman_problem).
      - Soy un entusiasta del software libre. Uso Linux desde que tengo 14 años.
      - Estoy en contra de la obsolescencia programada y la oligarquía de datos.[^1]
      - Mis temas favoritos de las ciencias de la computación son **el cálculo-λ y la [teoría de tipos de Martin-Löf](https://en.wikipedia.org/wiki/Intuitionistic_type_theory).**
      - Mi instrucción favorita de _x86-64 assembly_ es `rsqrtss`.
      - Milito en la agrupación Contragolpe y soy orgullosamente socialista☭.
      - Suelo ayudar con la organización de la **Noche de Juegos.**

      ## Por qué quiero ser codepper?

      **NB:** Si querés conocer más sobre las tareas que tiene un codepper, recomiendo leer
      [este artículo](https://comcom.dc.uba.ar/codep.html)
      en el sitio web de la ComCom.

      A mi modo de ver, hay dos grandes problemas que atraviesan el Departamento: falta de presupuesto y aumento de estudiantes. De esto ya se han dicho mil cosas, y yo creo que todes lo vemos. Sobre esto, tomo los siguientes compromisos si fuera elegido al CoDep:

      - Cuestiono cualquier "solución creativa" a la crisis de presupuesto que implique una pérdida en la calidad de la cursada y/o el nivel académico de la carrera. Nunca apoyaré cupos o límites de inscripción, ni recortes a los programas de las materias.
      - Estoy en contra de los planes de arancelamiento (explícitos o implícitos) de la carrera. Basta de trasladar contenidos de las carreras de grado a maestrías o posgrados arancelados.
      - Me opongo a la "administración de la miseria" en silencio. Cuando el Departamento atraviesa problemas presupuestarios, el CoDep debe pronunciarse públicamente. Propongo que el CoDep sea un espacio de debate y organización, y que se pronuncie sobre las medidas de lucha, como han hecho otros departamentos docentes (ej. DFBMC)

      Sobre cuestiones comunitarias de la ComCom y el DC quiero impulsar:

      - **Hacer la ComCom grande otra vez[^2]:** Tenemos la gran tarea de asegurar la continuidad de la cultura y conocimiento de la ComCom a las nuevas generaciones de ingresantes:
         - **Cubawiki y grupos de Telegram,** al servicio de les estudiantes y administrados colectivamente, por sobre cualquier alternativa privativa y partidaria.
         - Una ComCom independiente, plural, y abierta a todes. Mantengamos nuestros espacios de diálogo, abiertos a una variedad de opiniones, libres de toda discriminación, e independientes de cualquier aparato, para seguir construyendo la comunidad que tanto amamos.
         - A la facu no se viene solo a cursar: Sigamos organizando actividades comunitarias, para mostrar que la facu también es un espacio para conocernos y divertirnos.
      - **Alojamiento de la facultad para proyectos de estudiantes:** Muchos de nosotros tenemos ideas para proyectos de desarrollo de software, pero a veces nos vemos limitados por no tener donde hostearlos. El hosting es caro, en especial si es para algo dedicado a la comunidad, que no trae rédito. Por esto quiero impulsar que el DC ponga a disposición de les estudiantes espacio de hosting para proyectos comunitarios.

      ## Votá por mí

      Si leíste hasta acá, te agradezco encarecidamente por tu tiempo. Ojalá haya podido convencerte de que me acompañes con tu voto. Se vota del 13/10 al 17/10 en la oficina 1502 del Pabellón 0+Infinito (al lado del kiosko del CECEN) de 14 a 19 hs.

      Si querés contactarme, podés encontrarme en XMPP como [eittig@dcuba.ar](xmpp:eittig@dcuba.ar), en Telegram como [@ernestoittig](https://t.me/ernestoittig), y por email <eittig@dc.uba.ar>.

      PD: Si todavía no estás convencide, mirá
      [esta demostración](https://live.lean-lang.org/#)
      en Lean _muy rigurosa_ (!) de que soy el mejor candidato.

      [^1]: Si querés saber más sobre esto podés leer el [Manifiesto Cyberciruja](https://gopher.tildeverse.org/texto-plano.xyz/0/~peron/archivo/ezines/atdt/nros/atdt-zine-0x02/atdt-zine-0x02-09.txt).

      [^2]: Crédito a Zoe Marino por usar la frase primero y ser una persona muy copada.
  - nombre: Kamala
    contenido: |
      ¡Buenas!
      Soy Kamala Jimeno Leiton, estudiante de Datos y estoy interesada en ser representante en el CoDep. Mi telegram es @Kemelete (aunque siendo sincera, soy más de wpp por costumbre 😛 😛 ).

      # ¿Quién Soy?

      Soy de San Antonio de Areco 🌱, tengo 20 años, curso en varios turnos, y me gusta tener varios amigos asi que seguro me cruzaste en alguna clase, en los pasillos o en los labos estudiando. Trabajo como CM del gremio docente de la Universidad de San Martin (entre otras cosas jajaj), por lo que estoy muy informada de la gestión universitaria y de los problemas con el financiamiento ☝🤓 . Creo que por mi actividad tengo herramientas para fomentar la comunicación y manejo de redes que pueden ser aplicables en el DC ⚡. Ya estoy por llegar al título intermedio (siguiendo el plan de estudios de datos) y me gusta la idea de relacionar lo que estudio con las ciencias sociales.

      # Mi paso por la Facu

      Mi experiencia por la facu desde 2024 fue toda una aventura. Personalmente, me costó adaptarme a la ciudad y dentro de todo el caos que es capital, pasar de un colegio chico a lo que es la UBA fue todo un contraste también. Pero por eso soy muy agradecida de todo el acompañamiento desde las tutorias del primer año y los talleres que se hacen desde el DC para hacer la cursada mas llevadera y amena para los estudiantes. Teniendo esto en cuenta, tengo ganas de ser parte del CoDep para poder devolver todo el apoyo que me brindaron en estos años!

      # Lo que Quiero Hacer como Codeper

      ### Mejorar la relación entre Datos y Compu:
        Muchos de los de Datos se pasan a compu, y viceversa. Es sabido que compartimos un montón de materias y que el DC es el departamento que más nos influye dentro de los 3 departamentos que constituyen nuestra carrera. Por eso, me parece importante traer al consejo la perspectiva de los estudiantes de datos con sus inquietudes, problemas y sugerencias.

      ### Aumentar la visibilizacion del DC:
        Me parece importantísimo que los estudiantes que van ingresando a sus carreras sepan los recursos que tienen disponibles para tener una cursada llevadera. Ya sea con los recursos como CubaWiki y Machete, los talleres y los espacios virtuales y prescenciales para armar comunidad.

      ### Crecer en redes:

        Las cuentas de la ComCom tienen mucho potencial. Podemos utilizar las cuentas que ya están creadas para darle un perfil más activo a nuestro espacio. Va bastante de la mano con la propuesta anterior pero me parecía importante ponerlo en un item aparte.

      ### Incentivar a los nuevos estudiantes a involucrarse:

        Me parece importante incentivar el vínculo entre los nuevos estudiantes (como yo) y los que ya están en el DC hace tiempo. A mi me invitaron a participar como CoDeper también para mostrar las inquietudes de los que estamos en nuestros primeros años de carrera, y me parece que es algo que puedo aportar desde mi experiencia personal.

      ### Vínculo entre GenEx y CoDep:

        Soy muy conciente de mi rol como mujer en la ciencia y la computación, y me parece que aunque se puede ver un aumento de nuestra participación en el campo, creo que hay mucho por trabajar, más que nada en la falta de representación femenina. Es importante también visibilizar las herramientas que tenemos para poder defendernos de posibles actos de violencia dentro de la facu.

      # Últimos comentarios:

        Me parece importante acompañar el Reclamo Salarial de los Docentes: La calidad de vida de los docentes también nos compete como alumnos del DC.
        Creo que está en nuestras manos apoyar y acompañar su lucha para sostener nuestra queridísima Universidad Pública Gratuita y de Calidad.

        Adhiero también a la dificultad de coordinar la cursada con el trabajo, y lo cansador que es tener que viajar para venir a la facu. Ame la idea del grupo de Telegram (que admito que me sume hace poco) para poder charlar de lo que vivimos y transmitirlo al CoDep. La propuesta de más actividades virtuales / hibridas es algo a lo que apunto y me parece una buena solución.

      # Para Cerrar

        Ojalá que mi perfil les haya interesado, y sean parte de las elecciones para CoDepers 2025!! Si no es a mí, voten a alguno de los otros representantes que todos tienen propuestas muyy copadas. Besos y saludos a todos!! 💕 💕
  - nombre: Rezza
    contenido: |
      Holii soy Bruno (o buno o @fandenacho26 en Telegram) estudio compu desde el ya lejano 2021

      *About (F12)*
      - soy hincha de River,  fandenacho26 es por el gran Ignacio Martín Fernández y su icónica camiseta número 26
      - soy parte de cierta agrupación magenta de la facultad cuyo nombre no es relevante ahora
      - ayude con la cubaWEEKi (o al menos estuve en el grupo de Telegram)
      - participe de la noche de los museos y la semana de la computación (descubrí que la divulgación me gustaba hace 6 meses)
      - mi Pokémon favorito es Mudkip y de chico hacia romhacks de Pokémon Esmeralda
      - me gusta mucho usar paréntesis cuando escribo (por si no se notaba (el doble paréntesis me gusta todavía mas))

      *CoDep, ¿para que?*
       _"ok?? nada de eso tiene que ver con un codep????"_- quizás digas (acertadamente) leyendo todo lo anterior. Pero hay algunos ejes que me parecen importantes poder trabajar con nuestro gran gran DC

      - *Cursada:*
      No es ninguna noticia ni soy el primero en darse cuenta que las condiciones de cursada son cada vez más complicadas. Más allá del ya emblemático caso de Algo3/TDA, lo más común es encontrarnos con materias en donde las aulas y laboratorios no dan abasto para la cantidad de inscriptos, docentes desbordados porque el ratio de alumnos paso de 1:10 a 1:100 (ejemplo ilustrativo no verificado de ninguna manera), horarios que se superponen entre sí que hacen imposible cursar 2 materias al mismo tiempo si no coinciden en el plan de estudios sugerido (que como todos sabemos nadie sigue a rajatabla realmente), y más.
      Si bien muchos de estos problemas son consecuencia de la crisis económica y ningún CoDepper va a ser la solución al financiamiento universitario, creo que como estudiantes tenemos que poder llevar adelante discusiones de cómo afectan a nuestra formación y plantear si todos los parches que se están aplicando (exámenes multiple choice, promoción obligatoria, consultas con IA) funcionan realmente o si corresponde pensar en nuevas soluciones (como un turno de consultas virtual para las clases prácticas)

      - *Trabajo*
      Computación (y datos) tienen fama de ser las carreras con mayor salida laboral de la facultad. Sin embargo, el mercado laboral no es el mismo que hace 10 años cuando tener 4 finales aprobados era suficiente para encontrar trabajo de programador junior y cobrar en dólares trabajando de manera remota. A su vez, sostener un trabajo a la par que se estudia es un desafío en si mismo.
      Sobre esto vengo trabajando con el FEM para mejorar el programa de pasantías de la facultad, armar una feria de emprendedores (que dicho sea de paso si tenés un emprendimiento y estas leyendo esto podes anotarte acá: https://forms.gle/mqkRfpkxJeLTHVQg8) y una más que no puedo decir todavía pero si te queda la duda haceme acordar en una semana. Como CoDepper me gustaría trabajar para reforzar el vínculo entre el departamento y las distintas cooperativas de software llevadas a cabo por alumnos que existen hoy en día, además de ampliar la acreditación que se le da desde el DC a jornadas como la ECI o la JAIIO a otros eventos como el pycamp. (Yo como estudiante de computación que soy trabajo de profesor de piano)

      - *Comunidad y Extensión*
      Además de las clásicas noches de juegos y las recientes noches de karaoke, existen muchos grupos de estudiantes y graduados que trabajan en distintos temas relacionados con la computación. Me gustaría poder articular y reforzar el vínculo con ellos y tener un espacio para que podamos conocerlos mejor (algo parecido a lo que hace la gente datos con DataMe). También aprovecho para meter el chivo, este cuatrimestre estuve armando un proyecto con la Secretaria de Extensión para participar de UBA en Acción, llevando distintos temas sobre IA y Ciberseguridad a varios puntos de la ciudad. Ya lo hicimos un par (léase 2) de veces y salió muy bien así que si te interesa participar del proyecto aprovecho a meter el chivo del grupo de Telegram acá!!!! https://t.me/+3ia6uAXadjQ3YmYx

      Así que esa es un poquito mi presentación de por qué me interesa participar en el codep. Si te interesa charlar alguno de estos temas o cualquier cosa relacionada a la carrera mi Telegram siempre está abierto y mi número de celular está escrito en un cartel de la facultad (lo cual es un poco irónico para alguien que después va a hablarle a adultos mayores sobre ciberseguridad pero bueno cositas). Gracias por leerme <3
  - nombre: Ulises
    contenido: |
      Hola! Soy Ulises. Me pueden escribir a @uliseslp7 en Telegram.

      ## Sobre mi…

      - Estudiante de Computación del nuevo plan de estudios.
      - Trabajo en una startup como programador Backend.
      - Participé en competencias de programación representando a la facultad en instancias internacionales.
      - Mi lenguaje preferido es Python, ¡pero con tipado!
      - Me obsesiona hacer código lindo y que sea fácil de mantener. ¡Programar es un arte además de una ciencia!
      - Mis materias preferidas son Técnicas de Diseño de Algoritmos (Algo3), y Arquitectura y Organización de Computadoras (Orga 2). ¡Aunque la mayoría de las materias de la carrera me encantaron!

      ## Mis propuestas…

      - **Ajustes en el nuevo plan de estudios de Ciencias de la Computación:** El nuevo plan de estudios fue un gran avance para la carrera, pero creo igual que todavía hay que seguir mejorándolo. En base a lo que fui viendo y me fueron contando:
          - Hay cuatrimestres que están muy cargados de contenido. Por ejemplo, TDA y PLP juntas.
          - Hay materias con pocas horas para la cantidad de temas que se dan. Especialmente las del área de teoría.
          - Hay poca oferta de optativas que se puedan cursar de acuerdo a lo que indica el plan de estudios.

          Es entendible que ocurran estas cosas dado lo reciente que es el plan, pero creo que deberían tratarse estas cuestiones en el Codep. De esa forma, podemos ir mejorando estas cuestiones con un enfoque iterativo incremental.

      - **Talleres y actividades:** continuar apoyando los talleres que se realizan (Git, LaTeX, Docker), e incentivar la realización de nuevos talleres. Me parecen una herramienta fundamental para acercar nuevas tecnologías a los estudiantes y aprender nuevas habilidades más allá de los contenidos curriculares.

          En especial, me gustaría armar un taller de Programación Competitiva con apoyo institucional, para que más personas de la facultad puedan participar en estas competencias, que son sumamente divertidas y tienen problemas algorítmicos muy interesantes.

      - **Apoyar propuestas de los estudiantes**: Siempre abierto a escuchar nuevas ideas para tener un mejor tiempo en la facultad, donde todos pasamos muchísimas horas cursando, estudiando, aprendiendo y compartiendo.

      ## Sobre las elecciones…

      Si querés acompañarme con tu voto, las elecciones del Codep se van a desarrollar del día **Lunes 13 al Viernes 17 de Octubre**, entre las 14 y las 19hs en la sala 1502, de la PB del edificio 0+ Infinito. Si leiste hasta acá, ¡muchas gracias por tu tiempo!
  - nombre: Zoe
    contenido: |
      Hola la boluda de Zoe no llegó a escribir su presentación de CoDep así que me pidió que le escribiera algo.
      Soy Juli Goria o Jugo para los amigos y les voy a decir las tres razones por las que Zoe es la mejor codeper y la persona a la que deberían votar nuevamente.
      1. Le gusta mandar mails. Al mandar un mail siente una euforia equiparable a la de un pájaro que vuela al ser liberado de su jaula por primera vez. Este beneficio accidental (por no llamarlo adicción) hace que organizar cosas le produzca genuino placer. Sus habilidades con los mails incluyen tener múltiples personalidades (varias cuentas de mail dependiendo de a quién va dirigido) y que gente de todos los claustros del DC (estudiantes, docentes y no docentes (y hasta la gente de Maximia)) hayan recibido alguna vez un mail firmado por Zoe. Sus habilidades mailísticas la llevaron a: organizar logísticamente los talleres de la ComCom, organizar la noche de juegos, y muchas otras cosas que suceden detrás de la sombras y de las cuales los mortales no se enteran (pero créanme que pasan cosas).
      2. Tiene TDAH por lo que está todo el día mirando los mensajes de Telegram (excepto cuando se le rompe el timbre y no me abre por media hora). Por lo que son extremadamente altas las chances de que si tenés un problema y le hablás a Zoe te responda rápido. Soy testigo de los regalos y alabanzas que recibió Zoe como recompensa por su duro trabajo como codeper. Alguien una vez le regaló una caja de chocolates y los compartió conmigo (gracias Zoe).
      3. Tiene ambiciones y propuestas muy concretas. Si leen su candidatura del año pasado (ahre) https://github.com/comcomUBA/documentos/blob/master/CoDep/Candidates2024/Marino.md verán que el scope de las cosas que quiere hacer es no solo muy razonable sino que muchas de las propuestas sucedieron realmente. Voy a mencionar algunas de las cosas que dijo el año pasado que quería hacer y en qué quedaron:
        + Impulsar CubaWiki: organizamos la CubaWeeki (o CubaWiki Week https://www.cubawiki.com.ar/index.php/Cubaweeki), que fue una maratón de una semana de colaboración a Cubawiki. En esa semana hicimos un montón de cosas, se dictaron como 3 talleres, organizamos una sala de escape, hicimos una noche de juegos y ya no sé ni cuántas otras cosas más. Todo esto sucedió gracias a la gestión de Zoe y mía (me voy a dar un poco de crédito) y a toda la gente que se sumó a colaborar.
        + Taller de demostraciones: Durante la CubaWeeki organizamos 3 talleres nuevos, uno de ellos el taller de demostraciones.
        + Mejorar las Noches de Juegos: si bien sufrimos un siniestro xd (se robaron todo el contenido del mueble donde guardábamos las cosas) pudimos hacer 2 (dos) campañas de donaciones para juntar plata para la ComCom (y la noche de juegos).

      Para terminar tengo dos cosas para decir:
      1. Doy fé del poder de gestión de Zoe (es la que organiza cuando nos vamos de vacaciones).
      2. Tiene (tenemos) buenas ideas y conoce la suficiente gente como para concretarlas. Todas las actividades y cosas de arriba (sumado a las que no mencioné) requirieron conocer a las personas indicadas a las cuales pedirles cosas!

      Bueno esas son mis razones por las cuales deberían votar a Zoe.
      bye
