  - nombre: Losiggio
    contenido: |
      ### tl;dr

      Soy [@soymega](t.me/soymega) en telegram y la razón principal para presentarme
      es hacer el codep lo más transparente posible.

      ## Candidatura

      Entré a la facu el segundo cuatri del 2017 y este cuatri cursé SO, PAP y la
      optativa de LLVM. Hasta el fin del primer cuatrimestre estuve trabajando (y
      probablemente dentro de poco vuelva a trabajar y estudiar). ComCom es un marco
      participativo armar entre todos los estudiantes el mejor DC posible, ya sea con
      actividades como las JIECO o las ENIAC que vinculen estudiantes con el brazo
      investigativo de la facu como las NDJ que nos vinculan entre nosotros (cuando
      es muy fácil cerrarse sólo a las dificultades que nos atraviesan
      individualmente).

      Éste fué un año peculiar que creo nos muestra la necesidad de tener procesos
      claros y transparentes a la hora de permitir participar en los espacios
      institucionales. Dos ejemplos claros fueron las cataratas de dudas surgidas a
      partir de la obligatoriedad de las charlas del GenEx y las surgidas respecto al
      trabajo que está realizando la comisión del plan de estudios (tanto de nuestra
      carrera como el del MCD).

      Es ante esta situación que creo que debemos construir entre todos un espacio
      abierto para evitar los malentendidos que terminan en discusiones sin sentido
      una vez aclarada la situación.

      Finalmente creo que el movimiento impulsado por el grupo de mujeres del DC nos
      ayuda a evitar invisibilizar las problemáticas de género y expresión
      identitaria que existen en la facultad. Creo sin embargo que necesitamos
      protocolos claros de acción vistas la situaciones recientes. Sin estos
      protocolos se vuelve muy fácil tratar de "arbitraria" a cualquier resolución de
      un problema.

      Cualquier duda o pregunta pueden contactarme :)

      ## contacto

      * iglosiggio en dc.uba.ar (email)
      * iglosiggio en gmail.com (email)
      * [iglosiggio](https://github.com/iglosiggio) en github
      * [soymega](https://t.me/soymega) en telegram
  - nombre: Milicich
    contenido: |
      Hola! Soy Mariana y me presento como candidata a representante estudiantil en estas elecciones de CoDep[1].

      Para la gente que no me conoce, empecé la carrera el segundo cuatrimestre de 2016, después de haber hecho dos años de Química y un cuatrimestre de Física. Soy ayudante de segunda en Organización del Computador I y Taller de Álgebra I. Este cuatrimestre cursé Métodos Numéricos y Sistemas Operativos.

      Desde que arranqué Computación, empecé a asistir a las ComCom[2], y me fue interesando lo que iba sucediendo en el departamento.
      Mi motivación para presentarme como representante estudiantil surgió porque me parecen importantes los dos puntos a continuación, y pensé que podía hacer algo más que ser votante para que se lleven a cabo, especialmente porque son intereses en común que comparto con varies de mis comapañeres.

      1. Las mujeres y disidencias deben tener la confianza de que pueden hacer valer su voz ante cualquier opinión, problema o inquietud que tengan dentro del marco del DC.
      2. Quiero que mejoremos como comunidad, y que las actividades que fuimos implementando que nos resultaron enriquecedoras sigan llevándose a cabo, como por ejemplo las JIECO y los ENIAC[3] que nos ayudaron a acercarnos al ámbito de la investigación.
      Otro de los temas que me gustaría que se trabaje en CoDep es el de evaluar las herramientas que disponemos y crear nuevas contra la violencia y discriminación de género en el DC, ya que es importante propiciar un ambiente en el que nadie se sienta incómode, insegure ni inhibide.

      Pienso firmemente que quien sea representante estudiantil debe ser eso: alguien que represente a les estudiantes y sea nuestra voz en las reuniones de CoDep, como sentí que fueron les representantes de este año. Quiero que la voz de les estudiantes pueda ser escuchada y no interrumpida por ambiciones personales, por lo que me parece sumamente beneficioso el hecho que tengamos las ComCom, para poder hablar entre todes sobre cuestiones que nos competen y que sea una democracia lo más directa posible.

      Para finalizar, me parece muy importante que participemos la mayor cantidad de estudiantes en estas elecciones. Principalmente porque mientras más seamos les que votemos, mayor será la legitimidad de les representantes, que tomarán decisiones que nos repercuten como comunidad del DC, no sólo como estudiantes.

      Cualquier cosa, se pueden acercar y escribirme por Telegram[5] o hablarme en la facu.

      Saludos!


      Referencias:
      [1] Consejo Departamental. Hay uno por cada departamento docente en nuestra facultad. Organismo que toma las decisiones que atañen al Departamento de Computación. Está integrado por el director/la directora del departamento, tres representantes de profesores, dos de graduades y dos de estudiantes.
      [2] Comisión de Computación. Es un espacio donde les estudiantes de la carrera nos reunimos para discutir sobre distintas problemáticas que surgen o actividades que se proponen.
      [3] Jornadas de Investigación para Estudiantes de Computación.
      [4] ENcuentro entre Investigadores y Alumnes de Computación: https://eniac2019.dc.uba.ar/
      [5] @dodahkiin
  - nombre: Szperling
    contenido: |
      ## tl;dr

      Soy Sebita, estudio y trabajo y me presento para CoDeper estudiantil.

      No te olvides de votar del 25 al 29 de noviembre. ¡Es super importante!

      ## Sobre mí

      Me llamo Sebastián, entré a la carrera en 2015 y actualmente estoy cursando
      optativas/dando finales/pensando qué hacer con la tesis. También trabajo
      part-time en el sector privado desde 2016, por lo que hice la mayor parte de
      la carrera mientras trabajaba.

      Tal vez no me conozcan mucho pero quienes ronden seguido por la facultad
      posiblemente me hayan visto en alguna ComCom o Noche De Juegos.

      Durante la mayor parte de mi cursada en la carrera estuve bastante al margen
      de los temas políticos, pero le debo mucho a la facultad y a los movimientos
      estudiantiles, por lo que me gustaría devolver desde el CoDep, impulsando
      propuestas que ayuden a todo el estudiantado, en particular a aquelles en
      situaciones de mayor vulnerabilidad.

      ## Trabajo y estudio

      Todes "sabemos" que en nuestra industria hay "excelente salida laboral" o
      "desempleo cero", pero eso no significa que todo es fácil: manejar la
      exigencia del trabajo y el estudio puede ser agotador y estresante, y hoy en
      día no hay una red de soporte suficiente para quienes no pueden con la carga.

      Además, no todes tenemos las mismas oportunidades o privilegios: la mayoría
      de los puestos son full-time, varios de los cuales no tienen consideración
      con el estudio; hay quienes no pueden elegir abandonar o despriorizar el
      trabajo por su contexto económico; y existe una fuerte discriminación de
      habilidad y género que pone distintas exigencias en ambos campos.

      Varias de las decisiones del CoDep pueden afectar a los estudiantes de formas
      poco obvias, y en particular pienso aportar mi perspectiva como estudiante
      que trabaja para evitar que haya que elegir entre salario y educación.

      ## Género y diversidad

      Uno de los temas que más dieron vueltas por mi cabeza y mi vida en este
      último tiempo son las luchas por los derechos de las mujeres y otres
      no-"varones cis-genero heterosexuales". Creo que es un tema que los varones
      no entendemos o damos bola lo suficiente, y que hay mucho que nosotros mismos
      tenemos que hacer.

      En ese marco creamos junto con otros un grupo de Telegram para discutir de
      estas temáticas entre varones y brindar soporte a quién lo necesite. Las
      conversaciones que se han armado son muy interesantes y se compartió un buen
      nivel de material para seguir repensando nuestro rol y nuestra relación con
      les demás.

      Sin embargo, todavía hay bastante trabajo por hacer entre les estudiantes,
      ayudantes y docentes, y estaría bueno que el Departamento de Computación
      tome la iniciativa, sobre todo considerando lo excluyente que puede ser
      nuestra industria.

      Por supuesto, hay candidatas que viven estos temas en carne propia, y no puedo
      dejar de sugerir que las voten, pero a la vez los invito a los varones a ser
      parte de la discusión y el cambio social.

      ## Contacto

      Al final del día yo soy "otro candidato más". No tengo las respuestas ni las
      propuestas para todo, y no pretendo tenerlas. Por eso quiero mantenerme en
      contacto y disponible con todes les estudiantes que estén interesades en lo
      que se trata en el CoDep. Yo sé que suficientes preocupaciones tiene une con
      la vida y el estudio, más aún con el trabajo, y el tiempo no alcanza para
      preocuparse en el manejo del DC. Por eso pienso que quienes sean elegides
      tienen que estar a disposición de les estudiantes a quienes representan, y eso
      planeo hacer yo. Les dejo abajo mis datos de contacto para que me puedan
      encontrar y charlemos de lo que les parezca necesario.

      - [@zebaszp en Telegram](https://t.me/zebaszp)
      - [ZebaSz en GitHub](https://github.com/ZebaSz)
      - sszperling (at) dc.uba.ar por email
  - nombre: Ticona
    contenido: |
      ¡Hola! Soy Belu y me presento como candidata a Codep por el claustro estudiantil. Cuento un poco de mí para que se entienda qué me motiva a presentarme.

      * ¿Por qué me presento? *
      Entré a la facu en 2016 como bióloga, pero hice dos años química metiendo cada tanto una materia de compu. En 2018 tras hacer Algo2 y Orga2 aprendí cosas que jamás me hubiera imaginado que iba a estudiar y menos que menos que me iban a encantar, por eso este año pasé a cursar materias solo del DC (no, no planeo cambiarme más de carrera :3). Desde mi paso de química al DC me ha interesado los siguientes temas: qué enseñamos en el DC (acá plan de estudios), cómo enseñamos/aprendemos (acá formación docente), cómo es el ámbito del DC en comparación con otros departamentos (acá tema género e investigación).
      Actualmente curso Didáctica General y Métodos Numéricos, soy ayudante en Orga2 e Intro a la Computación, soy divulgadora del DC y este año fue mi primera ENIAC, COMCOM, ayudantía y NdJ.

      * Formación docente *
      Actualmente no hay ningún tipo de formación docente para quien toma un cargo de ayudantía. Esto me parece que es una falencia importante que tenemos tanto desde el aspecto del desconocimiento de lo que implica ser docente de une estudiante y la relación de poder que se establece sobre une alumne, como desde el aspecto de recursos didácticos que se pueden adquirir. Hay gente muy capaz en el DC y se podría armar un taller para problematizar estas cuestiones y darnos mejores herramientas para formanos mejor (tanto como alumnes como docentes). Desde el grupo de profesorado hay intención de poder concretarlo y creo que estaría bueno abrir el espacio para charlar del tema entre estudiantes y auxiliares.

      * Pluralidad de géneros y deconstrucción *
      En lo personal, vengo de una cultura y familia bastante conservadora y machista. Fue y sigue siendo todo un proceso el de abrir la mente, cuestionarse estereotipos, cómo nos educan, re-pensarse a une misme y entender a le otre. Mi transición de química a computación no fue fácil, más de una vez sentí que esta carrera no era para mí por palabras o chistes machistas que me dolieron, dudé de querer compartir el mismo espacio con mis compañeres durante años de carrera. Pero la verdad es que las realidades no se cambian por sí solas y si queremos construir un DC más inclusivo que contemple la diversidad, entendí que debemos organizarnos para poder construir en conjunto y expresar/visibilizar las situaciones que vivimos. En ese sentido, celebro que tengamos un Grupo de Mujeres y Grupo de Disidencias para compartir experiencias y pensar cómo podemos aportar al DC desde los géneros con los que nos autoperibimos. Celebro que haya un Grupo de Varones para discutir sobre masculinidades y que haya gente con ganas de deconstruirse, como también siento que queda mucho por trabajar para que dejen de darse situaciones que desvaloricen los planteos de género y para que se creen los mecanismos institucionales (dentro del DC) que traten estos temas.

      * Investigación *
      A diferencia de otras carreras de la facu, el estudiantado del DC se mantiene más alejado del ámbito de investigación científica. Estaría bueno reforzar las actividades de vinculación estudiantes-investigadores como las ENIAC de este año o la jornada de exposición de temas de investigación del año pasado. En química era usual que llegue por mail ofertas de tesis y se podría replicar acá una minuta de ofertas para evitar que cada une tenga que estar preguntando/tocando puerta. De hecho por ahí algune se pierde un tema que le interesa por desinformación, habiendo incluso becas de grado de investigación que pagan más que una ayudantía (ubacyt, cin, etc).

      Hago un cierre porque si no se hace muy largo pero quiero explicitar que veo la elección de Codep como la elección de un equipo de alumnes representantes de los problemas y necesidades de les estudiantes. Me explayé solamente en los puntos que creo mejor representar, seguramente haya problemas que yo no pueda comprender en profundidad como por ejemplo el hecho de trabajar en la industria y seguir con la carrera, pero otres representantes seguro sí. Por eso creo en la participación activa y trabajo en conjunto del equipo de Codep al cual me gustaría aportar desde mi perspectiva.

      Les invito a participar de la votación porque creo que para construir un mejor DC es necesario involucrarse en todas sus instancias (a diferencia de otros departamentos, el DC da un espacio de participación muy activa y linda y eso es muy valorable, sepamos aprovecharla :) ).
  - nombre: Zamboni
    contenido: |
      Hola, soy Gianfranco Zamboni y me estoy presentando como candidato a representante estudiantil en estas elecciones de Consejo Departamental (CoDep).

      **Sobre mi**

      Soy estudiante de la carrera desde el 2013. Actualmente me encuentro cursando Ingenieria 2 (me faltan métodos y materias optativas) y soy ayudante de segunda en Bases Datos.

      Durante este último año me estuve dando cuenta que hay una gran parte de nuestra comunidad que está constantemente trabajando y esforzandose para que el departamento pueda ofrecernos todas las oportunidades que nos ofrece. Siento que es hora de que aporte mi granito de arena para ayudar a que siga creciendo.

      **Comcom [1]**

       Creo que está bueno que se nos de voz y voto a les alumnes en las decisiones académicas. Un buen representante debería ser alguien que divulgue activamente las distintas cuestiones tratadas, sepa escuchar las opiniones de les demás y pueda llegar a un concenso que permita reflejar lo mejor posible la posición de la comunidad.

       Por esta razón, me gustaría mantener la Comcom como el espacio en el que todes podamos expresar nuestras ideas comodamente y promover la partipicipación de toda la comunidad de estudiantil. Además, se debería pulir el uso de las herramientas y canales de comunicación que tenemos para llegar a la mayor cantidad de personas.

      **Generos y disidencia**

       Si bien no estoy muy metido en el tema (y mis compañeras candidatas van a poder taclearlo mejor), reconozco que como comunidad nos falta recorrer un gran camino para conseguir que todes nos sintamos realmente cómodes en el departamento. Como dije, me parece que cualquier persona debería poder expresar sus ideas y sentir que pueden contar con sus representantes para conseguir el apoyo necesario ante cualquier inquietud o problema que tengan.

      **Actividades y Talleres**

       Por un lado, creo que es importante seguir incentivando, desde la Comcom, las distintas actividades (tanto académicas, como sociales) organizadas por les estudiantes. Estaría bueno volver a dar los talleres introductorios de Linux y Github para les alumnes que todavía no se sienten cómodes con estas herramientas y mantener las noches de juegos que nos sirven para acercarnos a nuestres compañeres y pasar un buen rato.

       Por otro lado, me gustaria seguir promoviendo las JIECO [2], los ENIAC [3] y las distintas actividades de extensión que  nos acercan y nos permiten interactuar con les investigadores de la facultad y la comunidad científica en general.

      **Docencia**

       Creo también estaría bueno poder discutir distintas alternativas que nos permitan pulir la calidad docente.
       Entre ellas, realizar una mayor divulgación de la carrera del profesorado que se dicta en la facultad que proporcionaría, a les interesades en dar clases, las herramientas necesarias para desenvolverse correctamente dentro del aula.

      **Para cerrar**

      Finalmente, creo que es importante que la mayor cantidad de estudiantes se involucre en la política del departamento y participe de estas elecciones para dar más legitimidad a les representantes elegidos, que tomarán las decisiciones que nos repercutirán, no solo como estudiantes, sino como comunidad.

      Cualquier cosa, si tienen ganas de charlar, pueden encontrarme dando vueltas en la facultad o escribirme por telegram (@gian150).

      Saludos!

      [1] Comisión de Estudiantes de Computación

      [2] Jornadas de Investigación para Estudiantes de Computación

      [3] Encuentro entre Investigadores y Alumnes de Computación
2022:
  - nombre: Felgueras
    contenido: |
      Hola! Soy Sebastian Felgueras (aunque probablemente me conozcas como Chevi) y soy candidato para ser representante estudiantil en el CoDep.

      Desde chico siempre me interesaron las matemáticas y la computación, lo que me llevó a estudiar computación en exactas (ahora estoy cursando Orga1 y Algo2). Una vez dentro, empecé a interesarme por la vida política y social de la facultad, lo que me llevó a participar de las discuciones y actividades de la ComCom, jugar con mis compañeres en las Noches de Juegos y a acercarme a Identidad. A partir de ese momento me di cuenta de que había bastante trabajo por hacer y que hay mucho por mejorar en Exactas. Es por eso que organicé y participé de grupos de estudio para las materias iniciales de la carrera, con el fin de tratar de reducir la deserción; participé de las discusiones acerca del nuevo plan de estudios, porque entiendo que es necesario que una carrera de vanguardia como la nuestra pueda actualizar su plan de estudios después de casi 30 años; participé y organicé recorridas por los laboratorios, para que desde los primeros años les estudiantes se puedan introducir en el mundo de la investigación; participé de las ferias de ciencias en los barrios populares, ayudé a organizar y coordinar el último taller de Linux de la ComCom y además hace más de un año coordino un espacio de análisis, formación y discusión sobre Datos [el Club de Datos!](https://www.instagram.com/club_de_datos/) todos los miércoles en la Facu.

      Finalmente, decidí que era momento de dar un paso más y presentarme como candidato a CoDeper, para poder seguir trabajando e impulsando las transformaciones que creo necesarias desde este nuevo lugar, pero siempre con la convicción de poder llevar a este espacio la voz y  los intereses de les estudiantes.

      Me pueden encontrar en telegram como [@SebastianFelgueras](https://t.me/SebastianFelgueras).
      Decidan acompañarme con su voto o no, quedo a disposición para lo que sea que necesiten y les invito a votar para hacer de esta elección un hecho masivo y participativo
  - nombre: Goria
    contenido: |
      Buenas, soy Julieta Goria (también me conocen como Jugo) y quería presentarme como candidata para ser representante estudiantil en el CoDep.


      Entré a la carrera en 2019 sin saber absolutamente nada de programación y motivada por el interés y las ganas de aprender. Tuve la suerte de que mi secundario nos trajera a varias actividades de extensión como la Semana de la Computación y demás, y por mi cuenta participé en los encuentros de los talleres de la DOV[1] sobre la carrera. Aprendí a programar gracias a los encuentros de Exactas Programa, en ambas ediciones, y eso solo me dio más ganas de involucrarme con la vida que transcurre en esta facultad.

      Actualmente soy divulgadora del departamento, en el equipo que dio los talleres por los cuales me convencí de estudiar computación, y también formo parte de un equipo de investigación dentro del grupo de Imágenes de la facu.

      Tl;dr? Le debo mucho de mi formación a la facultad, y me parece que la mejor manera de retribuirle es seguir construyéndola junto a mis amigos, compañeros de cursada y de carrera.

      * Una de las virtudes de nuestro departamento es la cercanía con los docentes e investigadores. Creo que crear más canales de conversación entre nosotros es un punto clave no solo para involucrar más a los estudiantes con el ámbito académico, sino para que podamos aprender más sobre nuestra facultad y el excelente trabajo que se hace dentro de ella. Gracias a las becas de investigación[2], muchos alumnos están teniendo la oportunidad de acercarse a este ámbito y tomar los primeros pasos de formación como investigadores. Estos programas son vitales no solo para crear lazos, sino para alentar la comunicación y el aprendizaje entre y para todos.

      * También con la vuelta a la presencialidad pudimos reactivar los talleres y actividades dentro de la facu :D. En el marco de la ComCom, desempolvamos el taller de Git y de Linux y volvieron las Noches de Juegos presenciales. Estoy segura que este tipo de actividades solo ayudan a enriquecer nuestra experiencia como estudiantes y que es responsabilidad nuestra activarlos y mantenerlos :sunglasses:.

      * Otro tema importante para mi es la representación dentro del departamento. Sabemos que la proporción de mujeres en la carrera es excepcionalmente baja, 17% en el 2019, aunque en el último tiempo vimos como lentamente va aumentando. Creo que es responsabilidad nuestra dar el ejemplo como comunidad y seguir creciendo y mostrando que los estereotipos de las mujeres en tecnología son eso. Hay que seguir construyendo un DC no solo abierto y tolerante, sino diverso y dispuesto a cambiar y a seguir evolucionando.

      Invito a si me quieren charlar o comentarme algo, soy ([@juli314](https://t.me/juli314)) en Telegram.
      Saludos!!

      [1] Dirección de Orientación Vocacional.
      [2] Becas de Iniciación a la Investigación en Ciencias de la
      Computación (BIICC)
