  - nombre: Chicconi
    contenido: |
      **Hola!**

      Soy Luca Chicconi y soy candidato para ser representante estudiantil en el CoDep.

      ### Quien soy

      Soy estudiante de computación del conurbano (existimos y somos miles) y estoy cursando Técnicas de Diseño de Algoritmos.

      Siempre fui un gordo jueguitos pero me dí cuenta que me gustaba la computación cuando tenía 13 años y tuve que programar un semáforo en asm (?). Funcionó (?)

      Al mismo tiempo que me cambié de física a computación, me acerqué más a Identidad y a la ComCom, haciendo lo posible por involucrarme cada vez más en la vida social y política del DC.

      Como anécdota random les cuento que soy el del cartel _"SIN CIENCIA NO HAY CONAN"_. No sabía que iba a salir en absolutamente todos los canales de televisión y se iba a hacer viral en Twitter pero bueno fueron mis 5 minutos de fama.

      ### Quizá me conozcas porque:

      - **Fui representante estudiantil en la comisión curricular durante todo el año pasado**.
      - Ayudo a organizar y difundir el **Club de datos** desde su concepción (soy viejo)
      - **Respondo consultas en los grupos de la comunidad de Whatsapp del DC**
      - **Estoy en los Grupos de estudio** de Álgebra CBC, Análisis CBC, Álgebra 1, IP , AED , 3 de carne , 3 de choclo 1 de carne 2 de choclo
      - Participé de varias ediciones de la **Semana de la Computación**, también estuve en el stand del DC de la Feria del Libro de éste año y en 2022 fui expositor en Tecnópolis. **Me gusta mucho la divulgación.**

      ### Qué quiero hacer como CoDeper

      - **Representar a les estudiantes del DC llevando sus reclamos e intereses** al Consejo Departamental.
      - Llevar a cabo propuestas que **mejoren la cursada para estudiantes que vivimos lejos y/o trabajamos** , todes vamos a estar de acuerdo en que es extremadamente díficil y sé que hay mucho para trabajar al respecto.
      - **Más y mejores recursos virtuales**
        para acompañar nuestra cursada.
      - **Mas instancias de discusión sobre género**, dados los hechos de público conocimiento, más instancias así son fundamentales para la comunidad. Especialmente en carreras como Compu y Datos, donde la mayoría de los estudiantes somos varones.
      - **Fortalecer el vínculo con Datos** : A pesar de que compartimos muchas materias y todes tenemos amigues de Datos, a veces cuesta que les estudiantes de Datos sientan el CoDep del DC como propio. El CoDep de Computación también es un espacio de representación para les estudiantes de Datos!

      Ok eso fue bastante texto

      Si llegaron hasta acá les agradezco mucho <3

      Como sabrán las elecciones de CoDep no son obligatorias pero les recomiendo muchísimo votar ya que así se puede escuchar su voz en el Consejo Departamental.

      ¡Me encantaría que me acompañen con su voto para transformar el departamento en uno cada vez más inclusivo pero más allá de a quién decidan acompañar con su voto, yo quedo a disposición para lo que necesiten!

      Mi handle de Telegram es @LucaChicconi.
      Cualquier cosa escribime!
  - nombre: Lannot
    contenido: |
      Holaaa me llamo _Martina_ y soy une estudiante de compu y no sé cómo debería
      pedir que me voten, entonces la hago corta:

      - Como cualquier no varón (y problemente muchos varones tambien) saben la
        carrera es muy hostil para las mujeres y diversidades. **Hay demasiadas
        barreras de entrada y mucho acoso cuando ya entrás.** Me parece algo muy
        importante para trabajar al nivel departamental (y bueno, sociedad).

      - Otra cosa que me parece importante es **mejorar la condiciones de cursada**.
        Sobre todo para les que viven lejos y/o trabajan. Es demasiado difícil
        mantener la cursada con como están las cosas ahora teniendo en cuenta la
        situación país.

      - Me parece también importante el **nexo entre les estudiantes y la
        investigación**. Creo que se deberían armar más y mejores oportunidades
        orientadas a eso.

      - Sumado a esto tenemos el problema de los **salarios docentes** y la
        importancia de **tener docentes de calidad** (que cada día se pierden
        más) en el departamento. Haría todo lo posible desde el lugar de codeper para
        mejorar esa situación.

      - Por último también quiero decir que me importa mucho **la ComCom y su
        independencia**. Desde que entré a la carrera que voy y estoy en los grupos,
        me parece un espacio re importante que (aunque gane esto o no) quiero seguir
        participando y mejorando.

      (Y de milagro escribí esto yo y no se lo mandé a ChatGPT. Soy horrible
      redactando)
  - nombre: Marino
    contenido: "**Hola :)**  \nMi nombre es **Zoe Marino**, pero capaz me conozcan\
      \ más por mi handle de Telegram: **@WinnaZ**.\n\n### ¿Quién Soy?\nSoy una estudiante\
      \ de computación que recuerda cuando había 50 personas en las aulas, así que\
      \ no dejen que mi número de libreta los engañe. Trabajo en la industria desde\
      \ los 18 años. No los voy a aburrir con mi CV, pero trabajé en una pyme de seguridad,\
      \ en la Corte Suprema, en una empresa nacional más grande y en una multinacional,\
      \ así que tengo un poco de todos los **flavors laborales**: chicos, grandes,\
      \ públicos y privados.  \nMi lenguaje favorito es **Python**, soy parte de **Python\
      \ Argentina** y una de las organizadoras del **PyCamp**.\n\n### Lo que Hice\
      \ en la Facultad\n- **Organizo las Noches de Juegos**, donde básicamente nos\
      \ juntamos a jugar y despejar la cabeza un rato antes de que el estudio nos\
      \ consuma vivos.\n- **Di el taller de Linux**, para que más gente sepa cómo\
      \ usar software libre sin que se sientan en la Matrix.\n- **Mantengo CubaWiki**,\
      \ una especie de Wikipedia local donde subimos cosas que usualmente quedan guardadas\
      \ en el disco rígido de alguien y nunca ven la luz del sol.\n\n### Lo que Quiero\
      \ Hacer como Codeper\n1. **Impulsar CubaWiki**  \n   Quiero lanzar una campaña\
      \ que motive a más personas a **subir sus apuntes, trabajos y recursos** ya\
      \ digitalizados que normalmente comparten entre amigues. Capaz, me gustaría\
      \ hacer **stickers** que digan: \"Yo también aporté a CubaWiki\", para incentivar\
      \ la participación.\n\n2. **Mejorar las Noches de Juegos**  \n   Aunque ya venimos\
      \ mejorando el evento, lo que realmente necesitamos es **un espacio de almacenamiento**\
      \ donde podamos guardar las cosas específicas que usamos en cada Noche de Juegos,\
      \ porque traer todo cada vez agrega a la complejidad. Cuanto más eficiente el\
      \ proceso, más ndj por año ;)\n\n3. **Taller de demostraciones**  \n   Así como\
      \ tenemos talleres de Git y Linux para cubrir el currículum invisible de la\
      \ carrera, creo que otro tema importante que nos piden saber, pero no se enseña,\
      \ es cómo demostrar cosas. Me gustaría organizar un taller enfocado en **aprender\
      \ a hacer demostraciones**, para que este conocimiento no quede fuera del alcance\
      \ de les estudiantes.\n\n4. **Hacer a la ComCom grande otra vez**  \n   Me parece\
      \ fundamental recuperar la participación activa en la **Comisión de Computación\
      \ (ComCom)**. Quiero trabajar para que vuelva a ser un espacio donde intercambiemos\
      \ como estudiantes sin que sea en horario laboral. Capaz hay una solución no\
      \ sincrónica que supere lo que venimos tratando.\n\n### Sobre Estudiar y Trabajar\n\
      Sé lo difícil que resulta **coordinar la cursada con el trabajo**. Muchas veces\
      \ se invisibiliza la opinión de les estudiantes que trabajan, dado el poco tiempo\
      \ libre que queda como para poder ir a una ComCom u otras actividades. Me parece\
      \ genial que haya surgido un grupo de Telegram para poder charlar estas problemáticas,\
      \ y creo que es importante llevarlas al **CoDep**.\n\n### Sobre Género y la\
      \ Carrera\nQuiero cerrar hablando de algo que me toca personalmente: **la falta\
      \ de representación femenina** en nuestra carrera. Es difícil no notar que somos\
      \ pocas las mujeres estudiando acá, y creo que eso es algo que tenemos que cambiar.\
      \ La diversidad es clave para mejorar la experiencia de todes y para construir\
      \ una comunidad más inclusiva.\n"
  - nombre: Nahuel Rabey
    contenido: |
      Buenass

      Soy Nahuel Rabey, y me presento cómo candidato a Codep del Departamento de Computación

      Capaz me conocen por armar con Agustín la última **asamblea de computación y datos**, así cómo haber participado en casi todas las asambleas y reuniones del cuatrimestre. Para referencia, tengo un mechón rojo.

      Bueno, al grano, estas son las cosas que me preocupan:

      1.  **Los profesores están desbordados de estudiantes**, no sólo hay pocos cargos sino que se presenta poca gente. Además, cada cuatri entran más estudiantes, y eso que las hordas de datenses apenas estamos llegando.

      2.  La **cantidad de laboratorios**: Este cuatri en Algo 1 se partieron en dos horarios porque los profes no podían tomar más horas; en el Labo de datos hay **cupos** y en Inge 1 se pasó de enseñar full laboratorio a partirse entre las teóricas-prácticas y la parte de programar; me la juego a que estos problemas se repiten en varias materias.

      3.  Los **salarios docentes son bajísimos**, ninguno vive sólo de enseñar y **cuesta formar cuadros universitarios** para dar algunas materias, cómo Orga I y II.

      4.  **La violencia en la facultad**, sobre todo que el acoso está expulsando compañeras de la cursada, y que cada vez me entero de denuncias que no llegan a ningún lado.


      Creo que **necesitamos preocuparnos por que la lucha universitaria llegue a una victoria**, sobre todo para resolver los problemas que coloqué antes. **Planteo hacer esto para lograrlo**:

      1.  **Impulsar el reclamo por aumento de cargos docentes** en el departamento de computación, tanto administrativamente cómo con campañas (fotos, juntadas de firmas, etc).

      2.  Hacer lo mismo pero para **conseguir más laboratorios**.

      3.  Organizar **reuniones sobre el estado del dpto**, sobre todo para estudiantes y docentes. _¿Cuánta plata tenemos? ¿Cuánta plata nos falta? ¿Cómo podemos conseguirla?_

      4.  **Difundir los presupuestos, su alcance, y limitaciones**. Crear una campaña de difusión de los problemas de enseñar ciencia y ejercerla en el ámbito de la computación y los datos.

      5.  Preparar una **segunda asamblea interclaustro del departamento de computación**. Organizar medidas cómo _clases públicas, banderazos, semáforazos_ para impulsar nuestros reclamos. **Que la sociedad vea nuestro reclamo y sepa que no se ha resuelto**.

      6.  Una charla-debate sobre **la ley de financiamiento educativo**. Yo creo que **es una trampa**, porque **no establece ningún aumento presupuestario**, sino que “autoriza” a hacerlo. Debemos esclarecer esto ante los estudiantes y los docentes.


      Ahora, lo que quiero cambiar.

      1.  **Rechazo cualquier solución que implique restringir la cursada**. Esto incluye cupos, o límites de horas para anotarse a materias.

      2.  **Rechazo “la administración de la miseria”**. Por ejemplo cuando el decano señaló en una reunión del DC **el pase de cargos docentes de las carreras de biología y química a las nuestras** cómo una solución a la sobrecarga docente. **Eso sólo perjudica a otros departamentos, y no resuelve de fondo nuestros problemas**.


      Sobre la violencia y acoso:

      1.  Organizar la comunidad. Esto es **conformar una comisión de estudiantes y docentes** que puedan acompañar a quienes se sientan amenazados. Quizás a las paradas del bondi, quizás hasta sus casas, quizás a hacer una denuncia. **Que desarrolle nuestras propias estrategias ante la problemática**, charlas, cursos, seminarios. Es claro que la facultad no ha podido institucionalmente, por lo tanto **impulsar a la comunidad a abordar este problema es elemental**.

      2.  Preparar conversatorios entre compañeros, para ver cómo nosotros vivimos estos grupos, por qué algunos eligieron participar de estas comunidades, construir espacios alternativos propios para alejarnos de entornos tóxicos.

      Muchas gracias por haber leído, espero cruzarlos en la cursada 🤘
  - nombre: Sandalinas
    contenido: |
      Soy Francisco, @SanFlan en Telegram.

      ### WhoIs
      Estudiante de computación.
      Gnomo hecho y derecho.
      De los pocos estudiantes activos en DIY DC.
      Nacido para ૮ ˶ᵔ ᵕ ᵔ˶ ა forzado a :)!
      Se muy muy poco de demasiado.

      ### Puntos de importancia
      1. Quiero impulsar CubaWiki.
        Creo fuertemente que CubaWiki salva carreras enteras. Necesitamos generar recursos para los estudiantes que requieran mantenimiento mínimo.
        Zoe y yo somos, a mi entender, les únicos admins activos.

      2. Impulsar medios de chat alternativos como medios de comunicación que no expongan los números de celular de la gente
        XMPP (dcuba.ar) o las comunidades ya existentes en telegram ~1800 estudiantes son alternativas viables.
        De esta forma también atacamos la fragmentación de los medios de comunicación, problema que complica el intercambio de saberes entre estudiantes mas avanzados e ingresantes a la carrera que quedan perdidos en un oasis de grupos de whatsapp.
        La facultad tiene que impulsar visiones alternativas al status quo actual y mostrar que no solo podemos hacer computo sino que el computo puede ponerse a disposición de las comunidades y acomodarse a las necesidades de estas.

      3. Impulsar otros modos de participación en la ComCom
        Últimamente se viene exigiendo corporalidad durante horario laboral en la ComCom.
        Esto imposibilita participar si es que se mantiene un trabajo.
        Planteo que reconsideremos estas actitudes.

      ### Lo mas importante de esta propuesta.
      Marino codepper, Francisco Suplente es la formula.

      -- La única identidad que conozco la canta Alvarez Quiroga --
  - nombre: Segre
    contenido: |
      Hola soy Pablo, me presento: estoy entre el tercer y cuarto año de la carrera, soy un estudiante del plan viejo, hice cerca de la primera mitad del plan antes de la pandemia. Me fue muy difícil continuar el estudio de manera remota por lo que retomé la facultad después en el 2022. Pude estudiar en un momento donde compartíamos pabellón con físicos y matemáticos, y la matrícula de estudiantes estaba entre 60 y 100 estudiantes. Pude ver a muchos  profesores/JTPs históricos del departamento irse y ver otros aparecer. También tuve la oportunidad de presentarme como ayudante de segunda, y de militar políticamente como estudiante universitario.
      Con todo este tiempo en la  facultad y como estudiante de esta carrera entiendo que nuestro departamento está lidiando con 3 problemas interconectados:
      1. Una cantidad de docentes limitada y serias dificultades para expandirla. El ajuste al que estamos siendo sometidos  no ayuda, pero también hay un problema histórico de no poder coordinar el desarrollo académico con el trabajo en la industria.
      2. El aumento en el tamaño de la matrícula conlleva un cambio en cómo deben darse las materias . Simplemente no es posible dar la misma clase que solía darse y a la vez la carga del trabajo de cada docente ha subido muchísimo. Acá es donde se suelen dar  la mayor parte de las fricciones entre docentes y estudiantes.
      3. El cambio al plan 2023, si bien hace correcciones pertinentes Hasta que no se implemente en su totalidad y se den todas las materias, la gente que está en el plan viejo tiene constantes modificaciones en el cronograma y las cursadas sufren por ello.
      Al ser ayudante pude entender lo que pasa de ambos lados del mostrador. Necesitamos generar espacios de diálogo y coordinación, para no sobrecargar a nuestros docentes y no vernos obligados a sacrificar la calidad educativa o, peor aún, nuestro propio bienestar. Creo que si bien la situación que nos toca es injusta y los recursos que tenemos son insuficientes, estamos en un momento bisagra como DC, y como estudiantes tenemos que aprovechar esta oportunidad para reforzar todas las herramientas que acompañan a nuestra cursada, sean los canales de Telegram, Cubawiki o los talleres. Hemos logrado crear una comunidad fuerte es importante poder preservarla. Quiero ponerme a disposición como CODEPer para alentar la aparición de estos espacios y encontrar maneras de que la cursada sea un espacio disfrutable para todas y todos.
