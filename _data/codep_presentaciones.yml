2018:
  - nombre: Freund
    contenido: |
      Hola, soy Teo y me presento como representante estudiantil para el CoDep 2019.

      Antes que nada, reitero la importancia de que todos voten en estas elecciones, el CoDep es una instancia de representación importante que tenemos la gente del DC como comunidad, y que necesitamos, no solo mantener, sino fortalecer. Este año viene siendo particularmente movido y dudo que el año que viene se calme.

      Para los que no me conocen, empecé la carrera en agosto del 2015, fui ayudante de Algo2 y del Taller de Álgebra durante el 2017 y la primera mitad de este año estuve haciendo una pasantía en EEUU. Ahora estoy cursando Métodos, PLP y PAP (Problemas, Algoritmos y Programación).

      Mi motivación para ser representante estudiantil en el CoDep es, principalmente, por una sensación de responsabilidad para con la facultad y el Departamento, donde considero que hay mucha gente que mueve muchas fichas para hacer de la carrera y la comunidad lo que es hoy. A medida que fui conociendo a la gente que hace ese esfuerzo, más me di cuenta que en algún momento se encontraron en el mismo lugar donde yo estoy ahora. Espero, como CoDeper, poder hacer algo que ayude a alguien.

      Considero que nuestra carrera es un caso muy particular, tiene una historia muy reciente y un presente con mucha fuerza y empuje. Estas razones nos permiten plantearnos cosas que tal vez en otras carreras son mucho más rígidas, y hace que tengamos una comunidad con mucha cercanía entre profesores/investigadores y estudiantes.

      Talleres
      ======
      Mi intención es lograr que se lleven a cabo talleres cómo el de GIT, que se dio un par de veces, e intentar incorporar algunos nuevos. Hay mucha gente muy capaz dando vueltas por los pasillos que creo que podría compartir lo que sabe con el resto.

      Acercar la Academia a los estudiantes (JIECO, ENIAC)
      ==============================
      Este movimiento que se comenzó a impulsar el año pasado me parece una idea increíble, que me gustaría seguir impulsando.

      Mujeres en la carrera
      =================
      Creo que acá hay un problema que tenemos que abordar como departamento, les dejo la publicación de Dani que lo explica mejor de lo que yo sería capaz, pero estoy de acuerdo con todo lo que dice. https://www.facebook.com/groups/dc.comcom/permalink/1738556722933420/

      Cualquier cosa que quieran preguntarme, pueden hablarme por acá o buscarme por la facultad.

      Saludos
  - nombre: Grosso
    contenido: |
      Hola, soy Alejandro "Tom" Grosso y me presenté como candidato a consejero departamental por el claustro de estudiantes.

      Nuevamente y como ya se mencionó, durante toda esta semana son las elecciones de codep y es necesario para poder darle un mayor peso y legitimidad a les codepers del 2019 que la mayor cantidad (es decir, todes) de estudiantes voten.

      Bueno, como ya varios de los candidatos expusieron y para no repetir demasiado, voy a contar mi apreciación personal de algunos de los puntos, así que:

      #include <"textos de candidatos anteriores">

      Empecé la carrera en 2015 (CBC) y desde el primer cuatrimestre de este año soy ayudante en orga 1. En cuanto a cursada estoy con las materias: lógica, redes e ingeniería 1.

      Me presenté porque quiero aportar mi ayuda para mejorar la facultad, las condiciones de cursada de los estudiantes y retribuir un poco a todo el trabajo que estudiantes anteriores hicieron para lograr estos mismos objetivos (me motiva más aún este momento donde la ciencia se encuentra cada vez más menospreciada por las políticas de turno); este mismo deseo me llevó tiempo atras a militar por algún tiempo en la conducción del cecen en 2016, aunque actualmente y desde hace un par de años me encuentro como independiente.

      Pienso que para poder mejorar es necesario una comunidad activa, por eso mi idea no se centra en une codeper con miles de proyectos, propuestas e ideas, sino en una gran comunicación entre todo el alumnado y les codeper, para eso, me parecen muy importantes las herramientas de comunicación que fueron surgiendo, como la comcom y los grupos de Telegram; grandes herramientas que hay que fortalecer, seguir apoyando, evolucionando e incluso generar nuevas, para que sigan permitiendo el diálogo y arbitrio de proyectos y problemáticas que se notan día a día y surgen entre los estudiantes, así como ser un medio de comunicación que permite que los estudiantes se informen y puedan generar debate.

      Como mención especial, hay que tener en cuenta las cuestiones de género. No se puede hacer caso omiso a lo desbalanceado que está la situación en cuanto cantidad de mujeres en la carrera, donde ya hay por suerte movimientos que trabajan para mejorar no solo esta situación, sino también a cualquier situacion de discriminación y/o violencia de género que pueda ocurrir en la facultad. Me refiero al grupo de Mujeres del DC y GeNex, programa del que por escasas reuniones fui parte como representante del departamento en 2017. Me gustaría continuar aportando pero esta vez desde un enfoque codeperil :D.

      También, nunca está de más leer la documentación oficial del codep para saber los detalles de lo que van a votar: https://www.dc.uba.ar/inst/autoridades/codep

      Y por último, pueden contactarme si quieren y preguntarme cualquier inquietud que tengan, ya sea por este medio, por telegram (t.me/ale_tg) o en la facu.
  - nombre: Guttman
    contenido: |
      Hola, soy Martín Guttman y me estoy presentando como candidato a CoDeper. Como me presenté el año pasado y soy consistente con mis ideas, esto es una edición actualizada y mejorada de la del año pasado.

      Soy estudiante de la carrera desde el segundo cuatrimestre de 2014, y actualmente me encuentro cursando Sistemas y Simulación de Eventos Discretos y trabajando como desarrollador en una empresa. Antes de pasar por FCEN estuve un tiempo estudiando la carrera de Historia en Puan. Soy CoDeper actualmente (3er suplente) y participo de la ComCom regularmente y de las actividades que organiza.

      Mis propuestas no son muchas, lo que pretendo es continuar con la lógica de CoDepers como vocales de los estudiantes en el consejo, pero aportando una visión extra, siempre sujeta a lo que surja de las ComCom, las cursadas, o las charlas de pasillo. Quiero acercar las problemáticas y las ideas de los estudiantes que trabajamos, tanto en el rubro, como me tocó ahora, como fuera del mismo, como me pasó en otros momentos. Si bien aún no estoy decidido frente al cuco de "academia o industria", me parece que hace falta alguien que esté también afuera, para seguir avanzando. En este sentido, recientemente creé un grupo de estudiantes en la industria en Telegram para que podamos discutir nuestras problemáticas, al que invito a sumarse a quien le guste

      A todos los que quieran consultarme o ahondar más, los invito a comunicarse por este post, por privado, por Telegram (soy @mdgtt, Martín G) o en los pasillos de la facu.

      Y recuerden, más allá de quien voten, vayan a las urnas a darle peso a lxs futurxs consejerxs cuando lleven ideas o problemas al CoDep.
  - nombre: Losiggio
    contenido: |
      ### tl;dr

      Soy [@soymega](t.me/soymega) en telegram, si les caigo bién vótenme,
      si les caigo mal voten a otros, _todos los candidatos son unos capos_.

      ## Candidatura

      Entré a la facu el segundo cuatri del 2017, estoy cursando algo2 y proba
      actualmente y trabajando haciendo giladas web. Desde que entré a la facu
      que estuve participando dentro del marco de la ComCom para poder entender
      las problemáticas de la facu y aportar lo que pueda desde mi lugar. Ser
      o no codeper difícilmente cambie esa actitud.

      La ComCom es un marco que está buenísimo para construir el dc que queremos
      como estudiantes. Esa es la principal razón por la que me inscribí cómo
      candidato.

      No tengo la capacidad de venderme porque **creo que representar al
      estudiantado requiere escucharlos a ustedes** para poder representarlos
      correctamente (en lugar de suponer que se puede tener una capacidad de
      decisión superadora y una agenda propia que resuelve todos los problemas).

      Cualquier duda/pregunta/insulto que tengan para mí **explicítenlo** :)

      saludos!

      ## contacto

      * iglosiggio en dc.uba.ar (email)
      * iglosiggio en gmail.com (email)
      * [iglosiggio](https://github.com/iglosiggio) en github
      * [soymega](https://t.me/soymega) en telegram
  - nombre: Mariottoli
    contenido: |
      Hola! Soy Daniela y me presento como candidata a Consejera Departamental por el claustro de estudiantes del DC.

      Para quienes no me conocen, soy estudiante (en proceso de hacer [empezar] la tesis), soy docente de PLP y también soy divulgadora del departamento. Además, trabajo en el proyecto de Plataforma Tecnológica del grupo de investigación LaFHIS [1].

      Antes de comentar los ejes centrales que me parecen de mayor relevancia para llevar al CoDep [2], quiero destacar la importancia que tienen estas elecciones: primero porque es importante que lxs estudiantes se involucren y participen en las decisiones que se llevan adelante en el departamento, y segundo porque la coyuntura política nos exige en este momento estar más organizadxs que nunca frente al ajuste en ciencia.

      -- Mujeres en computación --
      Una de las principales problemáticas que tiene nuestro departamento es la poca proporción de mujeres inscriptas (alrededor del 15%). Lxs estudiantes no tenemos representantes mujeres en el CoDep desde hace años. Y esto no es algo en particular del DC, sino que afecta a las carreras tecnológicas en todo el mundo. ¿Por qué es un problema? Además del trasfondo social de por qué las mujeres no “elegimos” una carrera informática, una vez que ingresamos, suele ser más difícil para nosotras llevarla adelante siendo las únicas mujeres de la clase, del grupo de tp, del grupo de amigos, etc. Es por esto que desde hace un tiempo conformamos un espacio llamado Mujeres del DC, que hoy en día funciona principalmente como lugar de contención de todas las compañeras que estudiamos esta carrera, pero que estamos llenando de contenido y de ideas para lograr un departamento más inclusivo. Además, desde la secretaría de extensión, armamos un stand de Mujeres en Computación [3] para la sdc2018 con el objetivo de visibilizar la problemática y destacar el trabajo de las mujeres del departamento. Siguiendo esta línea, considero un avance que en el CoDep haya una representante mujer llevando adelante los reclamos de las mujeres del DC.

      -- SOS Ciencia --
      Como mencioné antes, estamos en un contexto político que nos demanda estar organizadxs. La discusión de la paritaria docente, el ahogo presupuestario en las universidades y la situación de brutal ajuste que está sufriendo el sistema científico [4], nos encontró a lxs estudiantes luchando en unidad con el resto de los claustros, y esto me parece importantísimo. Es necesaria la participación estudiantil en la lucha que está llevando adelante nuestra facultad, y tenemos que estar preparadxs para lo que se viene porque el ajuste en ciencia no es algo pasajero, es una decisión política. Creo que con esta perspectiva, necesitamos un CoDep que esté a la altura del conflicto, como bien se vino haciendo estos meses organizando, por ejemplo, las charlas informativas sobre la situación actual de lxs docentes.

      -- Deserción --
      Desde hace mucho que se vienen buscando explicaciones para la gran cantidad de estudiantes que abandonan la carrera. El año pasado surgió, por iniciativa de algunos compañeros del departamento, implementar una prueba piloto del programa de tutorías que se hacía para el CBC, pero para lxs ingresantes. Participé de ese proyecto como tutora y me pareció una gran iniciativa por dos motivos: primero porque es importante que lxs ingresantes se nutran de las experiencias de lxs estudiantes más avanzados y que accedan fácilmente a información sobre la carrera y la facultad; y segundo porque sirve para estar más cerca del problema y entender los motivos de deserción en los primeros años. Creo que es importante que este programa de acompañamiento a ingresantes continúe a partir del cuatrimestre que viene.

      -- Académico y Extensión --
      Por último, me quedan tres ejes por mencionar que me parecen fundamentales en la política del departamento. El primero es el acercamiento de lxs estudiantes a los laboratorios de investigación, algo que ya se viene haciendo y que tuvo mucho éxito con las actividades JIECO y ENIAC. Yo personalmente decidí orientarme hacia la investigación una vez que conocí de cerca el LaFHIS, y creo que hay un poco de desconocimiento de lxs estudiantes (sobre todo los más iniciales) sobre lo que se investiga acá en la facu. Es necesario que se acorte esta brecha entre estudiantes e investigadores, no solo para que sea más fácil elegir un tema para la tesis, sino para que lxs alumnxs analicen desde temprano la posibilidad de elegir una carrera académica. El segundo eje que me parece importante fortalecer es la participación estudiantil en las actividades de extensión del departamento. Si bien suele haber buena convocatoria para la semana de la computación o la noche de los museos, creo que se podrían generar más instancias de lazos con organizaciones para poder realizar actividades de vinculación con la sociedad, de manera de llevar nuestro conocimiento a la gente y que más gente se acerque a Exactas y a Computación. Y el tercer y último eje es el plan de estudios. Nuestra carrera tiene un plan de estudios de hace ya más de 25 años, y necesita ser actualizado, no solo para incorporar contenidos sobre nuevas áreas, sino también para abrir la discusión sobre cuáles son las problemáticas que acarreó durante todo este tiempo. Es por esto que hoy en día se están armando comisiones para discutir el nuevo plan, y es fundamental que lxs estudiantes participemos de esta instancia y que tengamos conocimiento sobre las discusiones que se están llevando a cabo.

      Finalmente, reitero la invitación a participar de la elección con su voto, es importante que mucha gente vote para que lxs representantes tengan una mayor legitimidad en su claustro, y porque la forma de mejorar nuestra facultad es involucrándose y participando de las decisiones. También abro la discusión sobre estos ejes que a mi me parecen importantes, cualquier duda o propuesta pueden escribirme!

      𝐋𝐚𝐬 𝐞𝐥𝐞𝐜𝐜𝐢𝐨𝐧𝐞𝐬 𝐬𝐨𝐧 𝐝𝐞𝐬𝐝𝐞 𝐞𝐥 𝐥𝐮𝐧𝐞𝐬 𝟏/𝟏𝟎 𝐡𝐚𝐬𝐭𝐚 𝐞𝐥 𝐯𝐢𝐞𝐫𝐧𝐞𝐬 𝟓/𝟏𝟎, 𝐝𝐞 𝟏𝟒 𝐚 𝟐𝟎 𝐡𝐬. 𝐒𝐞 𝐯𝐨𝐭𝐚 𝐞𝐧 𝐥𝐚 𝐬𝐞𝐜𝐫𝐞𝐭𝐚𝐫í𝐚 𝐝𝐞𝐥 𝐝𝐞𝐩𝐚𝐫𝐭𝐚𝐦𝐞𝐧𝐭𝐨 𝐜𝐨𝐧 𝐥𝐚 𝐥𝐢𝐛𝐫𝐞𝐭𝐚 𝐨 𝐃𝐍𝐈.

      [1] http://lafhis.dc.uba.ar/

      [2] https://www.dc.uba.ar/inst/autoridades/codep

      [3]https://noticias.dc.uba.ar/20…/…/05/mas-mujeres-computacion/

      [4] https://sosciencia.net.ar/
  - nombre: Munich
    contenido: |
      Buenas! Como varies sabrán, esta semana hay elecciones de CoDep [1]. Soy Tobi y me presento como candidato a representante estudiantil. Quería escribir un poco sobre quién soy y que pienso, para que me conozcan un poco más :)

      # Un poco sobre mi #
      Entré a la carrera en el 2016, y actualmente estoy cursando Métodos y Orga2.
      Desde que ingresé me interesó dar una mano para mejorar la facultad en general, y al DC en particular, por lo que empecé a ir a las ComCom [2] que se fueron haciendo, y a participar en el FEM! [3].
      Durante todo mi CBC y primer año de carrera trabajé en Mercado Libre, como web dev, pero a principios de este año decidí dejarlo para poder concentrarme en la cursada y otras actividades en la facultad.

      # ComCom #
      Pienso que las ComCom son un muy buen espacio para que les estudiantes podamos expresarnos y llevar nuestras ideas. Desde allí surgieron las actividades más variadas, como las Noches de Juegos, Cine Debates o el ENIAC [4] que se hicieron este año, nos reunimos para pensar cómo acompañar a nuestres docentes en la lucha este cuatri y hasta hicimos nuestra propia bandera. Creo que además es el espacio ideal (aunque no el único) para que les representantes en el CoDep puedan escuchar las problemáticas que tenemos. Por esto vengo participando y pienso seguir haciéndolo. Sin embargo, algo que me gustaría es buscar la forma de que más estudiantes vengan a participar, probando nuevos formatos de reunión u otras ideas que surjan. En particular, el año pasado surgió la idea de crear una página web para la ComCom. Me gustaría revivir esta idea para que les estudiantes tengamos un lugar más ordenado para informarnos y estar al tanto de lo que sucede.

      # Género #
      La problemática de género es un gran desafío pendiente, principalmente en nuestra carrera, donde como ya sabrán el porcentaje de mujeres es muy bajo. Es por eso que este año, varias compañeras formaron el grupo de Mujeres del DC. Me parece imprescindible que se traten estos temas en el CoDep, por lo que pienso apoyar y acompañar las distintas ideas que surjan desde las compañeras. Festejo que este año haya una candidata a representante estudiantil mujer, luego de varios años con todos representantes estudiantiles varones. Me parece un gran avance para que se escuche la voz de las estudiantes. También creo que deberíamos erradicar todo tipo de violencia o discriminación de género en el departamento, y para eso me parece muy importante articular con el GenEx [5] y pensar actividades en conjunto.

      # Académico #
      Hace años se viene estudiando y avanzando lentamente la posibilidad de cambiar el plan de estudios actual [6]. Me parece que es una gran oportunidad para que les estudiantes mostremos y pongamos sobre la mesa distintos problemas con los que nos encontramos durante la carrera. Por esto me parece muy importante que todes estemos al tanto de las novedades que vayan surgiendo y se den los espacios de debate necesarios para que el cambio mejore la cursada. Desde el FEM! es un tema que venimos trabajando hace años y creemos que es muy importante para la cursada de las próximas generaciones.
      Varios de los problemas se empezaron a tratar por fuera del debate sobre el plan, organizando cosas como la JIECO [7] y el ENIAC para conocer mejor lo que hace un investigador, o la prueba piloto del Programa de Tutorías para Primer Año, donde fui tutor. Pienso que este último es un gran paso para combatir la deserción, en uno de los momentos más críticos de la carrera. Todas estas me parecen iniciativas super copadas que hay que seguir llevando adelante.

      # Estudiantes en la industria #
      Tengo la suerte de actualmente poder vivir sin trabajar, pero viví la experiencia durante dos años y se lo difícil que resulta coordinar la cursada con el trabajo. Muchas veces se invisibiliza la opinión de les estudiantes que trabajan, dado el poco tiempo libre que queda como para poder ir a una ComCom u otras actividades. Me parece genial que haya surgido un grupo de telegram para poder charlar estas problemáticas [8], y me parece importante llevarlas al CoDep.

      Me gustaría escribir mucho más, pero no quiero que quede demasiado largo. Cualquier cosa que quieran saber pueden preguntarme por acá, telegram [9] o por los pasillos de la facu!

      Es super importante que les estudiantes nos involucremos, no cuelguen en votar! Las elecciones son desde el lunes 1/10 hasta el viernes 5/10, de 14 a 20 horas. Se vota en Secretaría del departamento (al lado del Laboratorio 1) con Libreta o DNI.
      Varios de los que participamos de la ComCom somos candidatos, y vamos a seguir trabajando en conjunto con todos los estudiantes que se acerquen a participar.
      Acérquense a votar!
      Cuanta más participación más legitimidad va a tener la voz de los estudiantes en el CoDep.

      [1] El CoDep (consejo departamental) es el lugar donde se toman las decisiones políticas del DC. Lo conforman representantes de profesores, graduados y estudiantes (3, 2 y 2) y el director de departamento.

      [2] La ComCom (Comisión de Computación) es donde los estudiantes nos juntamos a discutir las problemáticas de la carrera así como también las proyectos y propuestas para mejorar el departamento. Es abierta a cualquiera que quiera participar.

      [3] Actual conducción del Centro de Estudiantes y mayoría estudiantil en Consejo Directivo.

      [4] ENcuentro entre Investigadores y Alumnes de Computación, idea de Facu Blanco y llevada adelante por varios estudiantes desde la ComCom. Consistió en una tarde de reuniones de investigadores con grupos reducidos de estudiantes, para poder conocer mejor y de primera mano a qué se dedica un investigador del DC

      [5]https://exactas.uba.ar/genex…/se-presento-el-programa-genex/

      [6]https://www.facebook.com/groups/dc.comcom/permalink/1461127557343006/

      [7] http://www.dc.uba.ar/events/jieco

      [8] https://t.me/EstudiantesDCenIndustria

      [9] @tobiascarreira
2019:
  - nombre: Barrios
    contenido: |
      Hola, soy Ezequiel Barrios, y soy candidato a CoDeper para este 2020.

      No quiero extenderme (aunque posiblemente lo termine haciendo) mucho ni escribir una carta llena de promesas o consignas políticas. Resumidamente, tomé la decisión de presentarme a CoDeper porque muchas veces durante la carrera sentí que mis CoDepers no me representaban con sus decisiones, sus discursos o su forma de pensar o manifestar realidades, que encontraba parcial o totalmente ajenas a la mía. Lo importante es que quizás muchxs estudiantes se sientan identificados al leerme, y quizás no. De eso se trata en gran parte la democracia. Necesariamente, sin embargo, debo presentarme y remarcar determinados puntos que entiendo son de mi interés y de la mayoría de quienes formamos parte del departamento.

      ## Sobre mí

      Soy estudiante de la carrera, actualmente cursando Ingeniería I, docente en Orga2 y Algo2, trabajo como programador en la biblioteca central de la facultad (pab2) desde hace 4 años, y adicional a ello también me encuentro trabajando part-time en la industria.

      ## Trabajar y Cursar

      Me tocó estar en la situación de tener que empezar a trabajar full-time al terminar la secundaria, y por necesidad tuve que hacerlo durante todo el transcurso de mi carrera. Por ello, soy totalmente consciente de las dificultades que conlleva cursar una carrera como esta trabajando, y este punto es algo que *realmente* me importa. Me parece fundamental tener siempre presente que no todxs tenemos las mismas realidades, y que exista en el CoDep gente que defienda los derechos y exponga las injusticias o vulnerabilidades a las que estamos expuestxs las personas que, además de estudiar, trabajamos (y que muchas veces nos afectan no solo a quienes trabajamos sino también al resto de lxs estudiantes). Supongo que la mayoría ya sabe cuáles son estas cuestiones, pero sólo para remarcar algunos de los problemas comunes: horarios de materias o exámenes no compatibles con la actividad laboral, falta de consideración hacia lx estudiante que tuvo que trabajar todo el día para luego de viajar una hora hasta la facultad encontrarse con que la clase se canceló sin previo aviso, o que la clase que según el cronograma oficial debía durar 5hs duró sólamente media hora, falta de herramientas o perspectivas dentro del temario de las materias que nos puedan servir el día de mañana para trabajar en la industria, modalidades y tiempos de cursada que sólo parecerían ser posibles de realizar si unx le dedica el 100% de su tiempo a la facultad... entre otras cosas.

      ## Actividades de Extensión

      Estuve participando durante dos años en Atalaya Sur, una organización social dedicada a dar clases de robótica, electrónica, computación, etcétera, los fines de semana a niñxs y adolescentes en villas y barrios carenciados del sur de Capital Federal. Allí aprendí mucho sobre mí mismo, y también sobre otras realidades distintas a la mía. También fui divulgador departamental, y participé activamente de diversas actividades de extensión (SdC, Noche de los Museos, Feria del Libro, etc) durante años. Considero importante que como parte de nuestro transcurso por la facultad realicemos prácticas de extensión, ya que no solo son un aporte para nosotrxs mismxs, sino también para la sociedad.

      ## Docencia

      Hace algunos años decidí ser docente en la carrera, y descubrí que la docencia es una actividad que me apasiona y me resulta super enriquecedora, y que es un lugar desde donde puedo aportar mi granito de arena. Como docente, trato de ponerle mi mayor compromiso a la actividad, y de ponerme del lado de lx estudiante, ya que yo mismo también soy uno. Antes de ser docente, participaba activamente en los canales de Telegram de las materias en las que soy docente (Orga2 y Algo2), ya sea respondiendo consultas como también intentando hacer aportes o mantener discusiones interesantes. Luego de comenzar a ser docente, seguí participando de estos canales, aunque con el correr del tiempo he aprendido y he tenido que ir variando las formas y modos en que se dan estas participaciones, ya que en su momento lo hacía como "estudiante que se copó con la materia", pero hoy en día lo hago como "docente de la materia", y si bien al principio me costó el cambio comprendo que esto último conlleva ciertas responsabilidades y premisas que deben ser respetadas. Quiero dejar pendiente este punto para retomarlo después, ya que me parece algo importante, y un problema actualmente en nuestra carrera.

      ## Militancia política

      No milito ni he militado en ningún partido político. Y lo siguiente lo aclaro sin ánimos de menospreciar ni poner en tela de juicio las intenciones y el compromiso (que creo que en ambos casos son buenos) de quienes además de aspirar a ser CoDepers militan en otros espacios políticos, ya sea dentro o fuera del ámbito universitario. En lo personal, no veo mal que esto suceda, pero también creo que es importante que tengamos CoDepers independientes que estén dispuestos a representar, escuchar y velar por los derechos y las necesidades del todo el cláustro al que representan, sin que ello vaya necesariamente acompañado de una determinada agenda política, ni de la intención de sacar algún tipo de rédito personal o partidario.

      ## Género

      Este párrafo es difícil de escribir sin que pueda llegar a ser malinterpretado. Me parece muy importante aclarar que no comparto muchos de los planteos y los modos del feminismo hegemónico - de género -, y la mayoría de las personas que me conocen lo saben. Esto sin embargo no me vuelve un violento, un machista, un misógino, ni tampoco me hace insensible o ajeno a las problemáticas, las desigualdades y las luchas de género vigentes. Tanto en mi papel de alumno como en mi papel de docente he sido acusado con estos o peores términos, y es algo super doloroso de tener que escuchar, incluso aún cuando la otra persona sienta que tiene razón o que está en su lugar de hacer o decir determinadas cosas. He llegado al punto de ser amenazado, de ser llamado violador, o pedófilo, sin mediar ningún tipo de justificación real que amerite tremendas palabras (y quienes realmente me conocen, alumnxs, compañerxs de trabajo, amigxs, saben que soy todo lo opuesto de la mayoría de estas cosas). No soy el único que ha tenido que atravesar este tipo de situaciones, injustificadamente. Más aún, considero que esta forma de expresarse sólo sirve para generar descontento y enemistades, destruyendo instantáneamente toda posibilidad de diálogo o remedio a una situación que ya de por sí es grave y delicada. Esta postura, radicalizada, en donde por el hecho de no estar de acuerdo con uno o más aspectos, o incluso sin llegar a estar de acuerdo por el simple hecho de animarse a cuestionar determinadas cosas uno se convierte en "el enemigo", es uno de los motivos por el cual me veo imposibilitado de compartirla, casi obligado a estar "del otro lado" (sin tener realmente ninguna intención de ser un "enemigo"). Es esta retórica del conflicto, en definitiva, en donde si uno no es un "aliado" (como si de una guerra se tratase) entonces es un "machito / machirulo", en gran parte lo que no comparto ya que además de ser estigmatizante, me parece una forma poco seria de lidiar con las cosas. Y en vez de analizar, concientizar y desarmar de raíz los problemas culturales que nos llevan a ser hoy en día la sociedad que somos, parecería que muchas veces se desemboca en la explicación fácil, que a su vez lleva a generar una solución fácil para un problema difícil (...y que obviamente no resuelve el problema). En lo personal, creo que todxs en el departamento somos personas, y merecemos el mismo grado de dignidad, respeto, tolerancia e igualdad de oportunidades. No creo que los problemas de la carrera relacionados con el género (que son también problemas de nuestra sociedad, y que lamentablemente no vamos a poder resolver fácilmente ni de un día para el otro) se vayan a resolver mediante acusaciones, chicanas ni violencia, y de mi parte repudio totalmente los discursos extremistas que sólo buscan generar situaciones de conflicto, sobre todo cuando estos provienen de representantes institucionales (ya sean docentes, CoDepers, etcétera). Creo que el tema es grave y debe ser tratado con la mayor de las seriedades, y que muchos de los organismos (como GenEx) que deberían estar encargándose de generar espacios y mecanismos en donde se puedan resolver los conflictos, no solo no lo están haciendo, sino que al contrario muchas de las medidas o posturas en las que se desemboca terminan repercutiendo negativamente. Lamento que este párrafo tenga que ser tan largo, pero me pareció importante aclarar de antemano mi postura.

      Y por si no quedó claro: sí, creo que desde el departamento, la facultad y la sociedad tendríamos que luchar por mejorar la situación con respecto al género (así como también con respecto a otras desigualdades e injusticias vigentes e igualmente válidas, aunque quizás políticamente no tan redituables), pero creo que debe hacerse mediante medidas constructivas que realmente busquen solucionar los conflictos, sin utilizar por ello al departamento como campo de batalla.

      ## Apoyo a la Docencia

      Relacionado con el punto anterior, y con lo que describí que fue mi experiencia como ayudante de 2da, creo que en el departamento se carece de la suficiente capacitación y apoyo a la docente (cada quien debe aprender la docencia, digamos, medio a los golpes), y esto es algo que nos afecta a quienes desempeñamos cargos docentes, pero principalmente nos afecta a quienes somos estudiantes. Si bien aprendí mucho de ello, mi primer cuatrimestre como docente fue particularmente duro, tocándome atravesar determinadas situaciones de conflicto, llegando al punto de verme expuesto situaciones de violencia y humillación, sin saber qué hacer, sin saber cómo actuar, y sin sentir que por parte del departamento o la facultad existieran los mecanismos que pudieran brindarme el apoyo o la contención necesarios. Creo importante, entonces, que el departamento implemente protocolos y capacitaciones adecuadas que permitan prepararse y adoptar el rol docente de la mejor forma posible, como así también que la actividad docente se pueda realizar dentro de un marco formal que proteja nuestros derechos como docentes y también como estudiantes. Y estoy dispuesto a apoyar y proponer medidas en pos de mejorar nuestra calidad educativa y el bienestar de nuestra comunidad.

      ## Talleres y Actividades

      Me parecen importantes las actividades complementarias que se realizan desde el ámbito de la ComCom, tanto las lúdicas como la NdJ, como los talleres de herramientas de Git, de LaTeX, así como los encuentros de divulgación de temas de investigación, y me interesa que dichas actividades se sigan realizando.

      ## Contacto

      No tengo Facebook. Si tienen dudas o inquietudes pueden contactarme a través de Telegram ([@lebarrios](https://t.me/lebarrios)) o buscarme en los pasillos de la facultad.
  - nombre: Carreira Munich
    contenido: |
      Buenas! Como varies sabrán, **esta semana hay elecciones de CoDep** [1]. Soy Tobi y me presento como candidato a representante estudiantil. Quería escribir un poco sobre quién soy y que pienso, para que me conozcan un poco más :)

      # Un poco sobre mi

      Entré a la carrera en el 2016, y actualmente estoy cursando Lógica, Inge 1 y Redes.
      Desde que ingresé me interesó dar una mano para mejorar la facultad en general, y al DC en particular, por lo que empecé a ir a las ComCom [2] que se fueron haciendo, y a participar en el FEM!.
      Durante todo mi CBC y primer año de carrera trabajé en Mercado Libre, como web dev, pero a principios del año pasado decidí dejarlo para poder concentrarme en la cursada y otras actividades en la facultad.

      # ComCom

      Pienso que las ComCom son un muy buen espacio para que les estudiantes podamos expresarnos y llevar nuestras ideas. Desde allí surgieron las actividades más variadas, como las Noches de Juegos, Cine Debates o el ENIAC [3] que se hicieron este año, nos reunimos para pensar cómo acompañar a nuestres docentes en la lucha y hasta hicimos nuestra propia bandera el año pasado.

      Creo que además es el espacio ideal (aunque no el único) para que les representantes en el CoDep puedan escuchar las problemáticas que tenemos. Por esto vengo participando y pienso seguir haciéndolo. De todos modos, me parece importante seguir fortaleciendo otras herramientas, como reuniones más puntuales o instancias virtuales (encuestas, etc).

      # Géneros y disidencias

      La problemática de géneros sigue siendo un gran desafío pendiente, principalmente en nuestra carrera, donde como ya sabrán el porcentaje de mujeres es muy bajo. Es por eso que desde el año pasado, varias compañeras formaron el grupo de Mujeres del DC. Me parece imprescindible que se traten estos temas en el CoDep, por lo que pienso apoyar y acompañar las distintas ideas que surjan desde las compañeras.

      Este año, los varones creamos un grupo para hablar y discutir de temas relacionados con feminismo desde cómo nos afectan (y cómo afectamos nosotros) estas problemáticas en nuestro rol como masculinidades. Me gustaría el año que viene ayudar a que este grupo crezca y debata nuevos temas. Por ahora viene siendo una experiencia virtual, que es un buen primer paso, pero con potencial para hacer muchas más cosas.

      También, este año las disidencias del DC creamos nuestro propio grupo. También es el primero paso para hacer mil cosas, dejar de estar invisibilizadas y avanzar en contra de la discriminación que sufrimos.

      # Académico

      Este año se empezó a debatir el cambio de plan de estudios de nuestra carrera. Personalmente, durante este año estuve asistiendo a las comisiones semanales para trabajar el tema, con otres estudiantes, graduades y profesores. Si bien en mi opinión se mejoraron varias cosas, creo que le faltan algunas iteraciones aún. Durante el año que viene vamos a tener, como estudiantado, que juntarnos mucho a debatirlo, sumar ideas y mejorarlo para que sea el mejor plan posible.

      # Estudiantes en la industria

      Tengo la suerte de actualmente poder vivir sin trabajar, pero viví la experiencia durante dos años y se lo difícil que resulta coordinar la cursada con el trabajo. Muchas veces se invisibiliza la opinión de les estudiantes que trabajan, dado el poco tiempo libre que queda como para poder ir a una ComCom u otras actividades. Me parece genial que haya surgido un grupo de telegram para poder charlar estas problemáticas, y me parece importante llevarlas al CoDep.

      Me gustaría escribir mucho más, pero no quiero que quede demasiado largo. Cualquier cosa que quieran saber pueden preguntarme por acá, telegram (@tobiascarreira) o por los pasillos de la facu!

      Es super importante que les estudiantes nos involucremos, **no cuelguen en votar!** Las elecciones son desde el lunes 25/11 hasta el viernes 29/11, de 14 a 20 horas. Se vota en Secretaría del departamento (al lado del Laboratorio 1) con Libreta o DNI.
      Varios de los que participamos de la ComCom somos candidatos, y vamos a seguir trabajando en conjunto con todos los estudiantes que se acerquen a participar.
      Acérquense a votar!
      **Cuanta más participación más legitimidad va a tener la voz de los estudiantes en el CoDep.**

      [1] El CoDep (consejo departamental) es el lugar donde se toman las decisiones políticas del DC. Lo conforman representantes de profesores, graduados y estudiantes (3, 2 y 2) y el director de departamento.

      [2] La ComCom (Comisión de Computación) es donde los estudiantes nos juntamos a discutir las problemáticas de la carrera así como también las proyectos y propuestas para mejorar el departamento. Es abierta a cualquiera que quiera participar.

      [3] ENcuentro entre Investigadores y Alumnes de Computación, idea de Facu Blanco y llevada adelante por varios estudiantes desde la ComCom. Consistió en una tarde de reuniones de investigadores con grupos reducidos de estudiantes, para poder conocer mejor y de primera mano a qué se dedica un investigador del DC
